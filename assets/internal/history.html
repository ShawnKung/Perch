<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>历史记录</title>
<style>
/* internal.css */
main{--selection-width:32px;max-width:980px;margin:auto;padding:28px 32px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;margin:0}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h1 svg{width:26px;height:26px;color:var(--perch-accent)}
.recording{display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;padding:8px 0}
input[type=checkbox]{accent-color:var(--perch-accent);width:16px;height:16px;cursor:pointer;margin:0;flex:none}
.search{display:flex;align-items:center;gap:10px;background:var(--perch-sidebar);border:1px solid var(--perch-line);border-radius:10px;padding:11px 14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
#search{width:100%;min-width:0;border:0;background:none;outline:none;font-size:14px}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:58px;font-size:12px}
.toolbar label{display:grid;grid-template-columns:var(--selection-width) auto;align-items:center;gap:8px;cursor:pointer;min-height:32px}
#select-all{justify-self:center}
#count{color:var(--muted);margin-right:auto}
.toolbar button{padding:7px 10px;border-radius:6px;min-height:32px}
button:hover:not(:disabled){background:var(--perch-line)}
button:disabled{opacity:.5}
#delete{background:var(--perch-mint);color:var(--perch-accent)}
#error{color:#b34434;line-height:1.6}
#paused{color:var(--muted);background:var(--perch-sidebar);padding:12px 14px;border-radius:8px;margin:0 0 18px;line-height:1.6}
.day{margin-bottom:24px}
h2{font-size:13px;font-weight:600;margin:8px 0;padding:8px 0;display:flex;align-items:center;gap:12px}
h2::after{content:"";height:1px;flex:1;background:var(--perch-line)}
.row{display:grid;grid-template-columns:var(--selection-width) 54px 24px minmax(0,1fr) 30px;align-items:center;gap:8px;padding:8px 10px 8px 0;border-radius:8px;min-height:58px}
.row:hover,.row:focus-within{background:var(--perch-sidebar)}
.row.selected{background:var(--perch-mint)}
.select{display:grid;place-items:center;align-self:stretch;cursor:pointer}
time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.site-icon{display:grid;place-items:center;color:var(--muted)}
.site-icon svg{width:17px;height:17px}
.visit{text-align:left;min-width:0;padding:4px 0;display:flex;flex-direction:column;gap:5px;border-radius:4px}
.visit:hover:not(:disabled){background:none;color:var(--perch-accent)}
.title,.address{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{font-size:13px;font-weight:500}
.address{font-size:11px;color:var(--muted)}
.remove{display:grid;place-items:center;min-height:30px;border-radius:5px;color:var(--muted);opacity:0}
.row:hover .remove,.row:focus-within .remove{opacity:1}
#empty{padding:56px 0;text-align:center;color:var(--muted)}
#more{display:block;margin:16px auto;padding:10px 20px;border-radius:8px;background:var(--perch-sidebar);color:var(--perch-accent)}
dialog{max-width:360px;width:calc(100% - 48px);color:var(--ink);background:var(--paper);border:1px solid var(--perch-line);border-radius:14px;padding:24px;box-shadow:0 16px 60px #0003}
dialog::backdrop{background:#0004}
dialog h2{font-size:17px;margin:0;padding:0}
dialog h2::after{display:none}
dialog p{color:var(--muted);line-height:1.6}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.dialog-actions button{padding:8px 18px;border-radius:7px;background:var(--perch-sidebar)}
#confirm-delete{color:white;background:#ad4035}
@media(max-width:600px){main{--selection-width:28px;padding:20px 16px}header{align-items:flex-start;gap:10px}h1{font-size:19px}.recording{font-size:12px;padding:4px 0}.toolbar{gap:6px}.row{grid-template-columns:var(--selection-width) 42px minmax(0,1fr) 28px;gap:6px}.site-icon{display:none}}
</style>
</head>
<body><main>
<header>
  <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7.4M3 5v6h6M12 7v5l3 2"/></svg>历史记录</h1>
  <label class="recording"><input id="recording" type="checkbox" checked>记录浏览历史</label>
</header>
<label class="search">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
  <input id="search" type="search" placeholder="搜索名称或网址" aria-label="搜索历史记录" maxlength="10000" autocomplete="off" spellcheck="false">
</label>
<div class="toolbar">
  <label><input id="select-all" type="checkbox" aria-label="全选当前搜索结果"><span>全选</span></label>
  <span id="count" role="status" aria-live="polite"></span>
  <button id="cancel-selection" hidden>取消选择</button>
  <button id="delete" hidden>删除所选</button>
  <button id="clear" disabled>清空历史…</button>
</div>
<p id="error" role="alert" hidden></p>
<p id="paused" hidden>已暂停记录浏览历史。已有记录仍会保留，重新开启后继续记录。</p>
<div id="timeline" aria-label="按时间排列的历史记录"></div>
<p id="empty" hidden>暂无历史记录</p>
<button id="more" hidden>显示更多</button>
<dialog id="confirmation" aria-labelledby="confirmation-title">
  <h2 id="confirmation-title">删除历史记录？</h2>
  <p id="confirmation-detail"></p>
  <div class="dialog-actions"><button id="cancel-delete" autofocus>取消</button><button id="confirm-delete">删除</button></div>
</dialog>
</main></body>
</html>
