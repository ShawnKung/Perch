<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<title>新标签页</title>
<style>
/* internal.css */
main{max-width:760px;padding:28px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--perch-mint);color:var(--perch-accent);display:grid;place-items:center}
.logo svg{width:29px;height:29px;fill:none;stroke:currentColor;stroke-width:1.5}
#date{font-size:12px;color:var(--muted)}
h1{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1.3;margin:0 0 13px}
.subtitle{font-size:14px;color:var(--muted);margin:0 0 20px}
.search-box{position:relative;display:flex;align-items:center;gap:10px;padding:14px;background:white;border:1px solid var(--perch-line);border-radius:13px;margin-bottom:20px;z-index:2}
.search-box>svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.5}
.search-box:focus-within{border-color:var(--perch-accent);box-shadow:0 0 0 3px var(--perch-mint)}
#search{min-width:0;flex:1;padding:2px 8px;border:0;background:transparent;font-size:16px;line-height:22px;height:26px}
#search:focus,#search:focus-visible{outline:none}
#suggestions{position:absolute;top:calc(100% + 4px);left:14px;right:14px;border:1px solid var(--perch-line);border-radius:8px;background:var(--paper);box-shadow:0 4px 8px #0002;overflow:hidden}
#suggestions button{display:flex;align-items:center;gap:8px;padding:9px;width:100%;text-align:left}
#suggestions button:hover,#suggestions button[aria-selected=true]{background:var(--perch-mint)}
.suggestion-info{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:12px}
.suggestion-info span,.suggestion-info small{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.suggestion-info small{font-size:10px;color:var(--muted)}
.chat{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:18px;background:white;border:1px solid var(--perch-line);border-radius:14px;margin-bottom:20px}
.chat-icon{width:27px;height:27px;flex:none;background:var(--perch-accent);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.chat-info{display:flex;flex:1;flex-direction:column;gap:4px}
.chat strong{font-size:15px;font-weight:600}.chat small{font-size:12px;color:var(--muted)}
.chat .arrow{width:15px;height:15px;color:var(--muted)}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
h2{flex:1;font-size:13px;font-weight:600;margin:0}
.section-header button{display:flex;align-items:center;gap:4px;padding:4px 0;color:var(--perch-accent);font-size:12px}
.section-header svg{width:12px;height:12px}
#shortcuts{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px}
.shortcut{display:flex;align-items:center;gap:12px;height:68px;padding:17px;width:100%;min-width:0;text-align:left;border-radius:12px;background:white;touch-action:none;user-select:none}
.shortcut img{width:20px;height:20px;object-fit:contain;margin:0 6px;flex:none}
.site-symbol{width:32px;display:grid;place-items:center;color:var(--perch-accent);flex:none}
.site-symbol svg{width:20px;height:20px}
.site-info{display:flex;flex-direction:column;gap:5px;min-width:0}
.site-info span,.site-info small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site-info span{font-size:13px;font-weight:600}.site-info small{font-size:10px;color:var(--muted)}
.drag-source{opacity:0}.drag-ghost{position:fixed;pointer-events:none;opacity:.88;box-shadow:0 8px 22px #0002;z-index:10}
</style>
</head>
<body><main>
<header><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="3" y="4" width="26" height="24" rx="4"/><path d="M3 12h26M8 8h3"/></svg></span><span id="date"></span></header>
<h1>把常用网页，<br>放在手边。</h1>
<p class="subtitle">少一次切换，多一点专注。</p>
<div class="search-box">
<svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg>
<input id="search" type="text" placeholder="输入网址或搜索" aria-label="网址" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" autocomplete="off" spellcheck="false">
<div id="suggestions" role="listbox" aria-label="网址建议" hidden></div>
</div>
<button class="chat" data-action="chat">
<span class="chat-icon" aria-hidden="true"></span>
<span class="chat-info"><strong>打开 Chat</strong><small>提问、引用标签页，继续之前的对话</small></span>
<svg class="arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 18 18 6M6 6h12v12"/></svg>
</button>
<section aria-label="快捷入口">
<div class="section-header"><h2>快捷入口</h2>
<button data-action="bookmarks"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>全部书签</button>
<button data-action="add"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg>添加</button>
</div>
<div id="shortcuts"></div>
</section>
</main></body>
</html>
