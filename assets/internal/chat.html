<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; frame-src about:; base-uri 'none'; form-action 'none'">
<title>AI 聊天</title><style>
/* internal.css */
html,body{height:100%;overflow:hidden;font-size:var(--perch-chat-font-size,13px)}
body{display:flex;flex-direction:column;line-height:1.65}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:default;opacity:.4}
button:focus-visible,summary:focus-visible,select:focus-visible{outline:2px solid var(--perch-accent);outline-offset:2px}
[hidden]{display:none!important}svg.icon{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.muted{color:var(--muted)}.detail{font-size:calc(1em * 11 / 13)}.small{font-size:calc(1em * 10 / 13)}.error{color:#b73d36;white-space:pre-wrap}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1;min-width:0}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#scroll{flex:1;min-height:0;overflow:auto;overflow-anchor:none;overscroll-behavior:contain}
#messages{padding:12px;width:100%;max-width:780px;margin:auto}
.message{padding:10px;border-radius:10px;margin-bottom:12px;overflow-wrap:anywhere;position:relative}
.message.user{background:var(--perch-mint)}.message.editing{outline:1.5px solid var(--perch-accent)}
.message.dimmed{opacity:.32}.message header{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:calc(1em * 10 / 13);font-weight:600;margin-bottom:4px}
.message header>span{flex:1;min-width:0}
.message-actions{display:flex;flex:none;opacity:0;pointer-events:none;transition:opacity .16s ease-in-out}
.message.hovered .message-actions,.message:focus-within .message-actions{opacity:1;pointer-events:auto}
.icon-button{display:inline-flex;align-items:center;justify-content:center;min-width:24px;min-height:24px;border-radius:5px}
.icon-button:hover{background:var(--perch-sidebar)}
.message-actions .icon-button,.followup .icon-button{position:relative;isolation:isolate}
.message-actions .icon-button{width:24px;height:24px;padding:0;flex:none}
.message-actions .icon-button:hover,.followup .icon-button:hover{background:transparent}
.message-actions .icon-button::before,.followup .icon-button::before{content:"";position:absolute;inset:2px;border-radius:4px;z-index:-1;pointer-events:none}
.message-actions .icon-button.hovered::before,.followup .icon-button.hovered::before,.followup-send.hovered .icon-button::before{background:var(--perch-sidebar)}
.followup .icon-button::before{inset:3px}
.message time{min-width:0;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:400;opacity:0;transition:opacity .16s ease-in-out}
.message.hovered time,.message:focus-within time{opacity:1}
.plain-text{white-space:pre-wrap}.message blockquote{margin:8px 0;padding:8px;background:var(--perch-sidebar);border-radius:7px;color:var(--muted);font-size:calc(1em * 11 / 13)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:5px;background:var(--perch-mint);padding:5px 7px;border-radius:7px;max-width:100%;font-size:calc(1em * 10 / 13)}
.message .chips{flex-direction:column;align-items:flex-start;gap:8px;line-height:normal}
.message .chips:not(:empty){margin-bottom:8px}
.message .source-chip{color:var(--muted);background:var(--paper);color:color-mix(in srgb,var(--muted) 80%,transparent);background:color-mix(in srgb,var(--paper) 60%,transparent);padding:3px 6px;border-radius:5px;text-decoration:none}
.message .source-chip svg.icon,.message-attachment svg.icon{width:1em;height:1em}
.message-attachment{display:flex;align-items:center;gap:4px;max-width:100%;font-size:calc(1em * 10 / 13);color:var(--perch-accent)}
.chip img{width:38px;height:38px;object-fit:contain;border-radius:4px}
details{margin:6px 0}summary{display:flex;align-items:center;gap:8px;list-style:none;cursor:pointer;min-height:26px;color:var(--muted);font-size:calc(1em * 11 / 13)}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg);transition:transform .22s ease-in-out;flex:none}
details[open]>summary::before{transform:rotate(135deg)}
.reasoning-text{max-height:220px;overflow:auto;white-space:pre-wrap;color:var(--muted);font-size:calc(1em * 11 / 13);overscroll-behavior:auto}
.spinner{display:inline-block;width:12px;height:12px;border:1.5px solid var(--perch-line);border-top-color:var(--perch-accent);border-radius:50%;animation:spin 1s linear infinite;margin-left:8px}
@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.sources{max-height:220px;overflow:auto;overscroll-behavior:auto}
.sources a{display:block;color:var(--muted);font-size:calc(1em * 11 / 13);margin:6px 0}
.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown h1,.markdown h2,.markdown h3{font-size:1.3em;line-height:1.4;margin:14px 0 8px}
.markdown p,.markdown ul,.markdown ol{margin:8px 0}.markdown ul,.markdown ol{padding-left:22px}
.markdown a{color:var(--perch-accent)}.markdown blockquote{padding:2px 12px;border-left:3px solid var(--perch-line)}
.markdown code{font:calc(1em * 12 / 13)/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--perch-mint);border-radius:4px;padding:2px 4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.markdown pre{position:relative;overflow-x:auto;background:var(--perch-mint);padding:34px 12px 12px;border-radius:8px;margin:10px 0}
.markdown pre code{padding:0;white-space:pre;overflow-wrap:normal}.code-tools{position:absolute;right:8px;top:6px;display:flex;flex-direction:row-reverse;gap:6px;opacity:0;pointer-events:none;transition:opacity .16s ease-in-out}
.markdown pre.hovered .code-tools,.markdown pre:focus-within .code-tools{opacity:1;pointer-events:auto}
.code-tools button,.table-tools button{border:1px solid var(--perch-line);border-radius:5px;background:white;color:var(--perch-accent);padding:2px 8px;font-size:calc(1em * 11 / 13);white-space:nowrap}
.table-wrap{overflow-x:auto}.markdown table{border-collapse:collapse;font-size:calc(1em * 12 / 13);min-width:100%;margin:8px 0}
.table-tools{display:flex;flex-wrap:wrap;gap:6px;padding-top:5px}
.markdown th,.markdown td{border:1px solid var(--perch-line);padding:6px 8px;text-align:left}.markdown th{background:var(--perch-mint)}
.markdown th button{font:inherit;text-align:left;width:100%;font-weight:600}.markdown th[aria-sort=ascending]::after{content:' ↑'}.markdown th[aria-sort=descending]::after{content:' ↓'}
.source-citation{text-decoration:underline dashed;text-underline-offset:3px;padding:3px 0}
.markdown .source-citation{font-size:calc(1em * 11 / 13);color:var(--muted)}
#quote-selection{position:fixed;z-index:1000;border:1px solid var(--perch-line);border-radius:7px;background:white;color:var(--perch-accent);padding:5px 10px;box-shadow:0 2px 8px #0002;cursor:pointer}
.file,.clarification{padding:10px;margin-top:8px;background:var(--perch-mint);border:1px solid var(--perch-line);border-radius:8px}
.file button,.clarification>button{color:var(--perch-accent)}.file iframe{width:100%;height:300px;border:0;background:white}
.file pre{max-height:220px;overflow:auto;font:calc(1em * 11 / 13)/1.6 ui-monospace,monospace;white-space:pre;margin:8px 0}
.file-diff .added{color:var(--perch-accent)}.file-diff .removed{color:#b73d36}
.file-controls{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.file-result{font-size:calc(1em * 10 / 13)}
.clarification fieldset{border:0;padding:0;margin:0 0 10px}.clarification label{display:block;margin:5px 0}.clarification input[type=text]{width:100%;padding:5px 7px;border:1px solid var(--perch-line);border-radius:5px;background:white}
.followup{display:flex;align-items:center;gap:0;width:fit-content;max-width:100%;margin-top:8px;border-radius:8px;background:var(--perch-mint);font-size:calc(1em * 11 / 13);line-height:normal;color:var(--perch-accent)}
.followup .followup-send{display:flex;align-items:center;gap:1px;min-width:0;padding:0 0 0 9px;text-align:left}
.followup .followup-send>span:first-child{min-width:0;overflow-wrap:anywhere;padding:7px 0}
.followup .icon-button{width:26px;height:26px;min-width:26px;min-height:26px;padding:0;margin-right:7px;flex:none}
.followup .followup-send .icon-button{margin-right:0}
.followup svg.icon{width:10px;height:10px;color:gray}
#setup{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}#setup button{color:var(--perch-accent)}
#composer-area{width:100%;max-width:780px;margin:auto;padding:20px;flex:none;max-height:65%;overflow:auto}
body.sidebar #composer-area{padding:12px}#composer-box{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--perch-line);border-radius:16px;background:white;box-shadow:0 2px 6px #00000006;line-height:normal}
#composer{display:block;flex:none;width:100%;height:64px;min-height:calc(2.4em + 8px);resize:none;border:0;outline:none;background:transparent;line-height:normal;padding:4px 5px}
body.sidebar #composer{height:52px}#composer:focus-visible{outline:none}#composer::placeholder{color:var(--muted)}
#draft-items{display:flex;flex-direction:column;gap:8px}#draft-items:empty{display:none}
#draft-quote{align-items:flex-start;padding:8px;background:var(--perch-mint);border-radius:7px;font-size:calc(1em * 11 / 13)}
#draft-quote .quote-text{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere}
#draft-quote .quote-source{display:block;appearance:none;padding:0;border:0;background:transparent;text-align:left;cursor:default}
#draft-items svg.icon,#references svg.icon{width:1em;height:1em}
#draft-items .icon-button,#references .icon-button{min-width:0;min-height:0;width:1em;height:1em;padding:0;border-radius:0;flex:none}
#draft-items .reference-close,#references .reference-close{font-size:9px}
#draft-items .chip,#references .chip{padding:6px;min-width:0}
#draft-items .chip>.icon:first-child,#references .chip>.icon:first-child,#draft-quote>.icon{color:var(--perch-accent)}
#draft-quote>.icon{fill:currentColor;stroke:none}
#draft-items .chips{flex-wrap:nowrap}
#draft-items .closed-reference{display:flex;width:100%}
#draft-items .closed-reference .muted{white-space:nowrap}
#draft-items .attachment{gap:8px;border-radius:6px}
#references{position:fixed;z-index:50;bottom:80px;right:12px;width:min(280px,calc(100vw - 24px));max-height:50vh;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px solid var(--perch-line);border-radius:10px;box-shadow:0 3px 15px #0002;line-height:normal}
#toolbar{height:34px;display:flex;gap:8px;align-items:center}#toolbar #attach{margin-right:auto}
#model-button{max-width:45%;font-size:calc(1em * 11 / 13);color:var(--muted)}
#search-enabled,#send,#stop{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center}
#search-enabled{background:#ddd;color:#777}#search-enabled[aria-pressed=true]{background:var(--perch-accent);color:white}
#send,#stop{position:relative;width:34px;height:34px;border:0;border-radius:0;background:transparent;color:white}
#send::before,#stop::after{content:'';position:absolute;inset:3px;background:var(--perch-accent);border-radius:50%;pointer-events:none}
#send svg,#stop svg{z-index:1}
#stop::before{content:'';position:absolute;inset:0;border:1.5px solid var(--perch-line);border-top-color:var(--perch-accent);border-radius:50%;animation:spin 1.1s linear infinite;pointer-events:none}#stop svg path{fill:currentColor;stroke:none}
#search-source-control{position:relative;display:inline-flex;align-items:center;justify-content:center;width:22px;height:24px;flex:none;isolation:isolate}
#search-source-control::before{content:"";position:absolute;inset:3px 0;border-radius:5px;z-index:-1;pointer-events:none}
#search-source-control:has(:focus-visible){color:var(--perch-accent)}
#search-source-control:has(:focus-visible)::before{background:var(--perch-sidebar)}
#search-source{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;font-size:11px}
#toolbar,#toolbar *{cursor:default}
#archive,#editing{margin-bottom:8px}#queue{max-width:632px;padding:0 6px;margin-bottom:8px}.queue-list{max-height:84px;overflow:auto}.queue-item{display:flex;gap:6px;padding:3px 8px;border-radius:7px;background:var(--perch-mint);margin:4px 0;font-size:calc(1em * 10 / 13)}
#mentions{border:1px solid var(--perch-line);border-radius:12px;background:white;padding:6px;margin-bottom:8px}#mention-list{max-height:184px;overflow:auto}
#mentions button{display:flex;flex-direction:column;text-align:left;width:100%;padding:8px;border-radius:8px}
#mentions button[aria-selected=true]{background:var(--perch-mint)}#mentions small{color:var(--muted)}
#models{position:fixed;z-index:50;right:12px;bottom:80px;width:min(290px,calc(100vw - 24px));height:min(350px,calc(100vh - 100px));padding:12px;background:var(--paper);border:1px solid var(--perch-line);border-radius:10px;box-shadow:0 3px 15px #0002;display:flex;flex-direction:column;gap:8px}
#model-search{width:100%;padding:6px;border:0;background:transparent}#model-search:focus-visible{outline:none}#model-list{overflow:auto;flex:1}
#model-list button{display:block;width:100%;padding:9px;text-align:left;border-radius:8px}#model-list button[aria-selected=true]{background:var(--perch-mint)}
</style></head><body>
<div id="scroll" tabindex="0" aria-label="对话内容">
<div id="setup" hidden><div><h3>连接你的 AI</h3><p class="detail muted">为此模型供应商配置模型和密钥后开始聊天。</p><button id="settings">配置 AI</button></div></div>
<main id="messages" aria-label="聊天消息"></main>
</div>
<section id="composer-area" aria-label="提问">
<div id="archive" class="row small" hidden><span class="grow muted">已归档</span><button id="restore">恢复对话</button></div>
<div id="editing" class="row small" hidden><span id="edit-label" class="grow muted"></span><button id="cancel-edit">取消</button></div>
<div id="mentions" hidden><div class="small muted">引用打开的标签页</div><div id="mention-list" role="listbox"></div></div>
<div id="queue" hidden><div class="row small"><span id="queue-label" class="grow muted"></span><button id="resume-queue">继续发送</button></div><div id="queue-list" class="queue-list"></div></div>
<div id="composer-box"><div id="draft-items"></div>
<textarea id="composer" aria-label="向 AI 提问，输入 @ 引用标签页" placeholder="输入问题，@ 引用标签页"></textarea>
<div id="toolbar"><button id="attach" class="icon-button" aria-label="添加附件" title="添加文本、代码、PDF 或图片"></button>
<button id="search-enabled" aria-label="联网搜索"></button><span id="search-source-control"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9 4-4 4 4m-8 6 4 4 4-4"/></svg><select id="search-source" aria-label="选择联网方式"></select></span>
<button id="model-button" class="truncate" aria-label="选择模型"></button>
<button id="stop" aria-label="停止生成" title="停止生成" hidden></button><button id="send" aria-label="发送"></button></div>
</div><div id="file-error" class="error small"></div><div id="storage-error" class="error small"></div><div id="length-error" class="error small"></div>
</section>
<section id="models" aria-label="选择模型" hidden><input id="model-search" placeholder="搜索模型…" aria-label="搜索模型"><div id="model-list"></div></section>
<section id="references" aria-label="引用的标签页" hidden></section>
</body></html>
