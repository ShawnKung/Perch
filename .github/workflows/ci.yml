name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Apple Silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        env:
          PERCH_CI_TRUST_SIGNING_CERT: '1'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          make test
          for binary in Perch PerchVault PerchAIKeys; do
            test "$(lipo -archs "build/Perch.app/Contents/MacOS/$binary")" = arm64
          done
      - name: Package app
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Perch.app dist/Perch-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Perch-macOS-arm64
          path: dist/Perch-macOS-arm64.zip
          if-no-files-found: error

  release:
    name: Publish tagged app
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Perch-macOS-arm64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/Perch-macOS-arm64.zip --verify-tag --title "$GITHUB_REF_NAME" --notes "Apple Silicon macOS app."
