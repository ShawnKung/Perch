name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      verify_release_tag:
        description: 'Optional version tag to rehearse without publishing (e.g. v0.1.2)'
        required: false
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  build:
    name: Build Apple Silicon app
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test release version rules
        run: python3 tests/test-release-version.py
      - name: Set release version from tag
        if: env.RELEASE_TAG != ''
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: bash scripts/prepare-release.sh "$RELEASE_TAG" "$BUILD_RUN_NUMBER" resources/Info.plist
      - name: Restore fixed signing identity
        env:
          SIGNING_KEYCHAIN: ${{ secrets.PERCH_SIGNING_KEYCHAIN_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.PERCH_SIGNING_PASSWORD }}
          SIGNING_CERTIFICATE: ${{ secrets.PERCH_SIGNING_CERTIFICATE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYCHAIN" && test -n "$SIGNING_PASSWORD" && test -n "$SIGNING_CERTIFICATE"
          umask 077
          signing="$HOME/Library/Application Support/Perch Signing"
          mkdir -p "$signing"
          printf '%s' "$SIGNING_KEYCHAIN" | base64 --decode > "$signing/signing.keychain-db"
          printf '%s' "$SIGNING_PASSWORD" > "$signing/keychain-password"
          printf '%s' "$SIGNING_CERTIFICATE" | base64 --decode > "$signing/certificate.pem"
          security list-keychains -d user -s "$signing/signing.keychain-db" /Library/Keychains/System.keychain
          sudo -n security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$signing/certificate.pem"
      - name: Build and test
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          make test
          for binary in Perch PerchVault PerchAIKeys; do
            test "$(lipo -archs "build/Perch.app/Contents/MacOS/$binary")" = arm64
          done
          if [[ -n "$RELEASE_TAG" ]]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Perch.app/Contents/Info.plist)" = "${RELEASE_TAG#v}"
          fi
      - name: Package app
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/Perch.app dist/Perch-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Perch-macOS-arm64
          path: dist/Perch-macOS-arm64.zip
          if-no-files-found: error

  release:
    name: Publish tagged app
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Perch-macOS-arm64
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/Perch-macOS-arm64.zip --verify-tag --title "$GITHUB_REF_NAME" --notes "Apple Silicon macOS app."
